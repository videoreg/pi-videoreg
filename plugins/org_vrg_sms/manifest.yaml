http:
  menu:
    - url: sms-inbox
      title: $sms.sms_inbox.title
      icon: sms
      component: SmsInboxComponent

  menu_settings:
    - url: sms
      title: $sms.settings.sms
      icon: sms
      component: SmsSettingsComponent

  components:
    - SmsIcons.js
    - SmsInboxComponent.js
    - SmsSettingsComponent.js

  api:
    - url: sms/list
      method: get
      plugin: sms.get_all_sms

    # Component sends {"filename": <name>} in the request body
    - url: sms/delete
      method: delete
      plugin: sms.delete_sms

commands:
  - name: sms
    title: SMS commands
