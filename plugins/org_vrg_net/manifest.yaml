http:
  menu_settings:
    - url: wifi
      title: WiFi
      icon: wifi
      component: WiFiSettingsComponent

    - url: modem
      title: $net.settings.modem
      icon: modem
      component: ModemSettingsComponent

    - url: wireguard
      title: WireGuard
      icon: vpn
      component: WireguardSettingsComponent

  dashboard:
    - component: DashboardWifiTile
      method: net.connections
      order: 60

    - component: DashboardModemTile
      method: net.modem_dashboard
      order: 70

    - component: DashboardWireguardTile
      method: net.wg_show
      order: 80

  components:
    - WiFiSettingsComponent.js
    - ModemSettingsComponent.js
    - WireguardSettingsComponent.js
    - DashboardWifiTile.js
    - DashboardModemTile.js
    - DashboardWireguardTile.js

  api:
    - url: net/wireguard_status
      method: get
      plugin: net.wg_show

    - url: net/wireguard_config
      method: get
      plugin: net.get_wireguard_config

    - url: net/wireguard_config
      method: post
      plugin: net.save_wireguard_config

    - url: net/generate_wireguard_key
      method: post
      plugin: net.generate_wireguard_key

    - url: net/wireguard_settings
      method: get
      plugin: net.wg_settings

    - url: net/wireguard_state
      method: post
      plugin: net.wg_set_state

    - url: net/wireguard_auto
      method: post
      plugin: net.wg_auto

    - url: net/wireguard_skip_on_wifi
      method: post
      plugin: net.wg_skip_on_wifi

    - url: net/modem_info
      method: get
      plugin: net.modem_info

    - url: net/connection_config
      method: get
      plugin: net.connections

    - url: net/connection_config
      method: post
      plugin: net.connection_update

    # Single high-level WiFi mode switch: {"mode": "client" | "ap" | "off"}
    - url: net/wifi_mode
      method: post
      plugin: net.set_wifi_mode

    # Component sends {"type": <name>}; enable/disable are separate endpoints
    - url: net/connection_enable
      method: post
      plugin: net.connection_up

    - url: net/connection_disanable
      method: post
      plugin: net.connection_down

    # Block/unblock are separate endpoints (no parameter)
    - url: net/wifi_block
      method: post
      plugin: net.wifi_block

    - url: net/wifi_unblock
      method: post
      plugin: net.wifi_unblock

commands:
  - name: net
    title: Network commands
  - name: wifi_block
    title: Disable WiFi module
    hidden: true
  - name: wifi_unblock
    title: Enable WiFi module
    hidden: true
  - name: wg_on
    title: Enable WireGuard
    hidden: true
  - name: wg_off
    title: Disable WireGuard
    hidden: true
