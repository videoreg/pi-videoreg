http:
  menu_settings:
    - url: power
      title: Power
      icon: battery
      component: PowerSettingsComponent

  dashboard:
    - component: DashboardPowerTile
      method: power.get_status
      order: 90

  components:
    - PowerSettingsComponent.js
    - DashboardPowerTile.js

  api:
    - url: power/status
      method: get
      plugin: power.get_status

    - url: power/wakeup
      method: get
      plugin: power.get_wakeup_config

    - url: power/wakeup
      method: post
      plugin: power.set_wakeup

    - url: power/charging-protection
      method: get
      plugin: power.get_charging_protection

    - url: power/charging-protection
      method: post
      plugin: power.set_charging_protection

    # Component sends {"minutes": n}
    - url: power/keep_alive
      method: post
      plugin: power.keep_alive

    # Component sends {"reason": "manual"}
    - url: power/reboot
      method: post
      plugin: power.reboot

    # Component sends the bare string "manual"
    - url: power/shutdown
      method: post
      plugin: power.shutdown

    - url: power/capabilities
      method: get
      plugin: power.get_capabilities

    # BLE beacon external-power detection
    - url: power/ble/config
      method: get
      plugin: power.get_ble_config

    - url: power/ble/enabled
      method: post
      plugin: power.set_ble_enabled

    - url: power/ble/target
      method: post
      plugin: power.set_ble_target

    - url: power/ble/grace
      method: post
      plugin: power.set_ble_grace

    - url: power/ble/clear
      method: post
      plugin: power.clear_ble_target

    - url: power/ble/scan
      method: get
      plugin: power.ble_scan
      timeout: 15 # one-shot scan runs ~6s

commands:
  - name: keep
    title: Keep alive for N min.
    args: 5
  - name: power
    title: Power commands
    hidden: true # reachable from the /more menu
  - name: reboot
    title: Reboot
    hidden: true # reachable from the /power menu
  - name: shutdown
    title: Shutdown
  - name: "no" # quoted: bare `no` is YAML boolean false
    title: Cancel scheduled shutdown
    hidden: true # corrective command sent manually; not shown in the menu
    # Cancels a same-batch /shutdown: when a shutdown queued while offline and a later
    # /no arrive together on reconnect, the /shutdown is dropped (see sdk/command_cancel.py).
    cancels:
      - shutdown

bot:
  status_method: power.get_status_text
  more_buttons:
    - text: Power
      callback_data: command__power__power
      weigh: 30

power:
  ask_before_shutdown: true # power calls its own power.is_ready_to_die before shutting down
