http:
  menu_settings:
    - url: telegram
      title: $bot.telegram.menu
      icon: tg
      component: TelegramBotSettingsComponent

  dashboard:
    - component: DashboardBotTile
      method: bot.get_status
      order: 110

  components:
    - BotIcons.js
    - TelegramBotSettingsComponent.js
    - DashboardBotTile.js

  api:
    - url: bot/config
      method: get
      plugin: bot.get_settings

    - url: bot/config
      method: post
      plugin: bot.set_settings

    - url: bot/status
      method: get
      plugin: bot.get_status

bot:
  status_method: bot.get_status_text # Telegram bot health line in the /status summary

power:
  ask_before_shutdown: true # power calls bot.is_ready_to_die before shutting down
